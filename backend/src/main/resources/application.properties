# Tự động nạp file .env nếu có (khi chạy trong thư mục backend hoặc thư mục gốc)
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=backend
server.port=${SERVER_PORT:5000}

# MySQL datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flight_ticket_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT configuration
jwt.secret=${JWT_SECRET:EasyFlightSecretKeyForJWTAuthentication2026ModernDesignProMaxUltra}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Mail configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:easyflight.noreply@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
